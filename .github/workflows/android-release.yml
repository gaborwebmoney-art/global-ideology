# Builds the Google Play bundle (.aab) from the web game.
#   * push to a branch named android/**  -> SELF-TEST: builds with a throw-away key, checks target API 36, package name, signature. Nothing is published.
#   * Run workflow (Actions tab, needs this file on main)  -> REAL build signed with your upload key from the repository secrets.
#       secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD   (create them with tools/make-upload-key.sh)
#       optional: PLAY_SERVICE_ACCOUNT_JSON + input upload=true pushes the bundle to the chosen Play track (the very first upload must be done by hand in Play Console)
name: Android release
on:
  push:
    branches: ['android/**']
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Play versionCode (must grow with every upload). Empty = run number + 100'
        required: false
        default: ''
      upload:
        description: 'Upload to Google Play after building (needs PLAY_SERVICE_ACCOUNT_JSON)'
        type: boolean
        default: false
      track:
        description: 'Play track when uploading'
        type: choice
        options: [internal, alpha, beta, production]
        default: alpha
permissions:
  contents: read
jobs:
  aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SELFTEST: ${{ github.event_name == 'push' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: Android SDK licences (the runner image already has the SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" | tail -3
      - name: Keystore
        id: ks
        shell: bash
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SPW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KAL: ${{ secrets.ANDROID_KEY_ALIAS }}
          KPW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/upload.jks"
          if [ "$SELFTEST" = "yes" ]; then
            PW="$(openssl rand -hex 12)"
            keytool -genkeypair -keystore "$KS" -storepass "$PW" -keypass "$PW" -alias selftest -keyalg RSA -keysize 2048 -validity 30 -dname "CN=GI self-test"
            echo "::add-mask::$PW"
            { echo "GI_KEYSTORE_PASSWORD=$PW"; echo "GI_KEY_PASSWORD=$PW"; echo "GI_KEY_ALIAS=selftest"; } >> "$GITHUB_ENV"
            echo "Self-test: throw-away key (this bundle is NOT for Google Play)."
          else
            for v in B64 SPW KAL KPW; do
              if [ -z "${!v}" ]; then echo "::error::Missing secret for $v. Run tools/make-upload-key.sh on your computer and add the four secrets (see docs/PLAY.md)."; exit 1; fi
            done
            printf '%s' "$B64" | base64 -d > "$KS"
            { echo "GI_KEYSTORE_PASSWORD=$SPW"; echo "GI_KEY_PASSWORD=$KPW"; echo "GI_KEY_ALIAS=$KAL"; } >> "$GITHUB_ENV"
          fi
          echo "GI_KEYSTORE=$KS" >> "$GITHUB_ENV"
      - name: Build bundle
        shell: bash
        run: |
          set -euo pipefail
          VC="${{ github.event.inputs.version_code }}"
          [ -n "$VC" ] || VC=$(( ${{ github.run_number }} + 100 ))
          echo "GI_VERSION_CODE=$VC" >> "$GITHUB_ENV"; export GI_VERSION_CODE=$VC
          npm install --no-audit --no-fund
          node tools/make-www.js
          npx cap add android
          npx cap sync android
          node tools/android-prepare.js
          cd android && ./gradlew --no-daemon bundleRelease
      - name: Check the bundle
        shell: bash
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          M="$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$AAB")"
          echo "$M" | head -40
          echo "$M" | grep -q 'package="app.globalideology.game"' || { echo "::error::wrong package name"; exit 1; }
          echo "$M" | grep -q 'android:targetSdkVersion(0x[0-9a-f]*)=(type 0x10)0x24' || { echo "::error::targetSdkVersion is not 36"; exit 1; }
          echo "$M" | grep -q "versionCode(0x[0-9a-f]*)=(type 0x10)0x$(printf '%x' "$GI_VERSION_CODE")" || { echo "::error::versionCode is not $GI_VERSION_CODE"; exit 1; }
          jarsigner -verify -verbose:summary "$AAB" | tee "$RUNNER_TEMP/jar.txt" | tail -3
          grep -q 'jar verified' "$RUNNER_TEMP/jar.txt" || { echo "::error::bundle is not signed"; exit 1; }
          unzip -l "$AAB" | grep -q 'base/assets/public/index.html' || { echo "::error::game files missing from the bundle"; exit 1; }
          unzip -l "$AAB" | grep -q 'base/assets/public/privacy.html' && echo "note: privacy.html is inside the app" || true
          ls -l "$AAB"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SELFTEST == 'yes' && 'global-ideology-SELFTEST-not-for-play' || 'global-ideology-release-aab' }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Upload to Google Play
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.globalideology.game
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: draft
